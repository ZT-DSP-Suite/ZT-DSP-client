[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zt-dsp-py"
version = "1.0.0"
description = "ZT-DSP — Zero Trust Dynamic Synchronization Protocol (code 1.0.0; follows the ZT-DSP Protocol Master Guide, docs 1.0.2)"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["cryptography"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
zt-dsp-py = "zt_dsp_py.cli:main"

[tool.setuptools]
# Flat layout: the project root is the package directory (zt_dsp_py/pyproject.toml lives inside the package)
packages = ["zt_dsp_py"]
package-dir = { "zt_dsp_py" = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
