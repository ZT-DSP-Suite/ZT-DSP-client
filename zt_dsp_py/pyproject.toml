[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zt-dsp-py"
version = "1.0.0"
description = "ZT-DSP — Zero Trust Dynamic Synchronization Protocol (code 1.0.0; follows the ZT-DSP Protocol Master Guide, docs 1.0.0)"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
dependencies = ["cryptography"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
zt-dsp-py = "zt_dsp_py.cli:main"

[tool.setuptools]
# Flat layout: the project root is the package directory (zt_dsp_py/pyproject.toml lives inside the package)
packages = ["zt_dsp_py"]
package-dir = { "zt_dsp_py" = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]
