# Publishing pipeline: triggered by a client-v* tag.
#
#   git tag -a client-v1.0.1 -m "..." && git push origin client-v1.0.1
#
# Produces the Python distributions, a Windows one-file executable, and a GitHub Release
# with generated notes and assets. Nothing is published to any package index.
name: Release

on:
  push:
    tags: ["client-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build ./zt_dsp_py --outdir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  exe:
    name: Build Windows one-file executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -e ./zt_dsp_py
          pyinstaller --onefile --name zt_dsp_py zt_dsp_py/__main__.py
      - name: Smoke test
        run: dist/zt_dsp_py.exe --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: exe
          path: dist/zt_dsp_py.exe

  github-release:
    name: Publish GitHub Release
    needs: [dist, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: exe
          path: dist
      - name: Attach license texts and third-party notices
        run: |
          # The wheel and sdist already carry LICENSE; the one-file executable does not.
          # Ship the license texts and third-party notices alongside every release asset.
          cp LICENSE LICENSING.md THIRD-PARTY-NOTICES.md dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Re-running the workflow for a tag that already has a release (for example after the
          # tag was moved) must replace it instead of failing with "release already exists".
          gh release delete "${{ github.ref_name }}" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            --title "ZT-DSP client ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag \
            dist/*
