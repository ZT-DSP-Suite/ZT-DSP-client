name: Lint and format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-format:
    name: Python formatting (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      # The repo has no committed ruff config, so the default rule set is used and
      # formatting is checked without rewriting files. Adding a pinned config is a
      # deliberate follow-up, not something to smuggle in here.
      - name: Check formatting
        run: ruff format --check zt_dsp_py

  rust-format:
    name: Rust formatting (rustfmt + clippy)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/rs-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check formatting
        run: cargo fmt --manifest-path zt_dsp_rs/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path zt_dsp_rs/Cargo.toml --all-targets -- -D warnings