# Static analysis for the Python reference implementation (GitHub code scanning).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b  # v3
        with:
          languages: python
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b  # v3
