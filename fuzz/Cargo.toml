# cargo-fuzz manifest.
#
# A separate workspace: cargo-fuzz builds with nightly and its own sanitizer flags,
# and mixing that into the release build would change what CI actually ships.
#
# The library target (zt_dsp_rs) is what this fuzzes -- before the [lib] target was
# added, the crate was bin-only and could not be linked from a fuzz target at all.
[package]
name = "zt-dsp-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.zt_dsp_rs]
path = "../zt_dsp_rs"

[[bin]]
name = "frames"
path = "frames.rs"
test = false
doc = false
bench = false