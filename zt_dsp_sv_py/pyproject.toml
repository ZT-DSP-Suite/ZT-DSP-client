[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zt-dsp-sv"
version = "1.0.0"
description = "ZT-DSP 1.0.1 server role: pair peers, then relay opaque bytes"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"

[project.scripts]
zt-dsp-server = "zt_dsp_sv_py.server:main"

[tool.setuptools]
packages = ["zt_dsp_sv_py"]
