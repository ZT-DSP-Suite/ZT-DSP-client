[package]
name = "zt-dsp-rs"
version = "1.0.0"
edition = "2021"
description = "ZT-DSP_RS-1.0.0 — reference Rust implementation of the ZT-DSP protocol (follows the ZT-DSP Protocol Master Guide, docs 1.0.2)"
license = "AGPL-3.0-or-later"

# The crate is both a library and a binary. The library target is what makes the
# protocol usable as a dependency and lets fuzz/ (cargo-fuzz needs `use
# <crate>::...`) link against it; the binary target is the CLI.
[lib]
name = "zt_dsp_rs"
path = "lib.rs"

[[bin]]
name = "zt-dsp-rs"
path = "zt-dsp-rs.rs"

[dependencies]
x25519-dalek = "2"
sha3 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
aes = "0.8"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
getrandom = "0.2"
serde_json = "1"
hex = "0.4"
base64 = "0.22"
socket2 = "0.5"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
